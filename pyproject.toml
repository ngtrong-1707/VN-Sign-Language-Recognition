[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-vision"
version = "2.1.0"
description = "Hệ thống Nhận diện Cử chỉ Ngôn ngữ Ký hiệu Tiếng Việt Thời gian thực (VSL)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VSL Vision Team"}
]
dependencies = [
    "torch>=2.0.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.9",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "Pillow>=10.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
postgres = [
    "asyncpg>=0.29.0"
]

[project.scripts]
vsl-hud = "vsl.cli.hud:run_hud"
vsl-server = "vsl.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
